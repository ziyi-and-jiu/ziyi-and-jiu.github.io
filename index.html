:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget > :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type="file"] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type="file"]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

<body>
<style>
  /* ─── Van Cleef & Arpels · malachite jewel-box system ─── */
  :root {

    ['jiu_lab','冯久实验室同学','Jiu’s labmate','circle',6], ['swimming','游泳','Swimming','hobby',2],
    ['strength','力训','Strength training','hobby',2], ['photography','摄影','Photography','hobby',3],
    ['bartending','调酒','Mixology','hobby',2], ['bjj','巴西柔术','Brazilian jiu-jitsu','hobby',2], ['triathlon','铁人三项','Triathlon','hobby',2], ['cycling','骑行','Cycling','hobby',2],
    ['field_nutrition','营养科学','Nutrition','field',11], ['field_cs','计算机科学','Computer Science','field',3],
    ['field_ece','ECE','ECE','field',3], ['field_petroleum','石油工程','Petroleum Engineering','field',2],
    ['field_statistics','统计学','Statistics','field',2], ['field_irom','IROM','IROM','field',2],
    ['graduated','博士毕业','PhD Graduated','status',3]
  ];
  const couples = [['ziyi','jiu'],['andrew','qianqian'],['maripat','haidar'],['ece','jason'],['valeria','michael'],['sally','kevin'],['shuhuang','mengxia'],['lavender','jonathan']];

    en:{nameA:'Ziyi',nameB:'Jiu',eyebrow:'You are invited',kicker:'Wedding After Party Invitation',whenLabel:'When',when:'Sunday, September 6, 2026 · 6:30 PM',whereLabel:'Where',where:'4424 Jackson Avenue',whereSub:'Austin, Texas 78731',shared:'Shared circles',hosts:'Party hosts · Married',common:'Friends of both hosts · 9',ziyi:'Ziyi’s friends · 16',jiu:'Jiu’s friends · 6',branch:'Friend-circle branch',couple:'Couple connection',overlap:'Selected shared tag',once:'Each guest appears once',people:'people',pairs:'pairs'}

  function cloverSvg(className) {
    const holder = document.createElementNS(SVGNS,'svg');

    if (className) holder.setAttribute('class',className);
    const use = document.createElementNS(SVGNS,'use');
    use.setAttribute('href','#zj-clover');
    holder.appendChild(use);
    return holder;
  }

  function makePerson(person) {
    const article = document.createElement('article');
    article.className = `person-node${person.group === 'host' ? ' host-node' : ''}${person.absent ? ' is-absent' : ''}`;
    article.dataset.person = person.id;
    article.dataset.group = person.group;
    article.dataset.tags = person.tags.join(' ');
    const port = document.createElement('span');
    port.className = 'person-port';
    port.setAttribute('aria-hidden','true');
    port.appendChild(cloverSvg());
    const body = document.createElement('div');
    const main = document.createElement('div');
    main.className = 'person-main';
    const name = document.createElement('h4');
    name.className = 'person-name';
    name.textContent = person[language];
    main.appendChild(name);
    if (person.roleZh) {
      const role = document.createElement('span');
      role.className = 'person-role';
      role.textContent = language === 'zh' ? person.roleZh : person.roleEn;
      main.appendChild(role);
    }
    const tags = document.createElement('div');
    tags.className = 'guest-tags';
    person.tags.forEach(key => {
      const definition = tagCatalog[key];
      const tag = document.createElement('span');
      tag.className = 'guest-tag';
      tag.dataset.tag = key;
      tag.innerHTML = `<span class="tag-dot" data-type="${definition[2]}"></span><span class="tag-label"></span>`;
      tag.querySelector('.tag-label').textContent = definition[language === 'zh' ? 0 : 1];
      tags.appendChild(tag);
    });
    body.append(main,tags);
    article.append(port,body);
    return article;
  }

  function renderPeople() {
    const targets = {host:root.querySelector('#hosts-list'),common:root.querySelector('#common-list'),ziyi:root.querySelector('#ziyi-list'),jiu:root.querySelector('#jiu-list')};
    Object.values(targets).forEach(target => target.innerHTML = '');
    people.forEach(person => targets[person.group].appendChild(makePerson(person)));
  }

  function renderControls() {
    controlsRoot.innerHTML = '';
    overlapDefs.forEach(([key,zh,en,kind,count]) => {
      const button = document.createElement('button');
      const active = key === selected;
      button.type = 'button';
      button.className = 'chip';
      button.dataset.overlap = key;
      button.dataset.kind = kind;
      button.dataset.count = count;
      button.setAttribute('aria-pressed',active ? 'true' : 'false');
      button.innerHTML = '<span class="stone" aria-hidden="true"></span><span class="overlap-label"></span><span class="chip-count"></span>';
      button.querySelector('.overlap-label').textContent = language === 'zh' ? zh : en;
      button.querySelector('.chip-count').textContent = `· ${count}`;
      button.addEventListener('click',() => selectOverlap(key));
      controlsRoot.appendChild(button);
    });
  }

  function updateLanguage() {
    const s = strings[language];
    root.lang = language === 'zh' ? 'zh-Hans' : 'en';
    root.querySelector('#zj-overlap-eyebrow').textContent = s.eyebrow;
    root.querySelector('#zj-name-a').textContent = s.nameA;
    root.querySelector('#zj-name-b').textContent = s.nameB;
    root.querySelector('#zj-overlap-kicker').textContent = s.kicker;
    root.querySelector('#zj-when-label').textContent = s.whenLabel;
    root.querySelector('#zj-when').textContent = s.when;
    root.querySelector('#zj-where-label').textContent = s.whereLabel;
    root.querySelector('#zj-where').textContent = s.where;
    root.querySelector('#zj-where-sub').textContent = s.whereSub;
    root.querySelector('#shared-tag-heading').textContent = s.shared;
    root.querySelector('#hosts-heading').textContent = s.hosts;
    root.querySelector('#common-guests-heading').textContent = s.common;
    root.querySelector('#ziyi-guests-heading').textContent = s.ziyi;
    root.querySelector('#jiu-guests-heading').textContent = s.jiu;
    root.querySelector('#legend-group').textContent = s.branch;
    root.querySelector('#legend-couple').textContent = s.couple;
    root.querySelector('#legend-overlap').textContent = s.overlap;
    root.querySelector('#legend-once').textContent = s.once;
    root.querySelector('#thread-title').textContent = language === 'zh' ? '关系与重合连线' : 'Relationship and overlap threads';
    root.querySelector('#thread-desc').textContent = language === 'zh' ? '金线串起当前所选标签的宾客，玫瑰金短线连接伴侣。' : 'A gold thread strings the guests who share the selected tag; rose-gold links join couples.';
    const cn = root.querySelector('#zj-language-cn');
    const en = root.querySelector('#zj-language-en');
    cn.setAttribute('aria-pressed',language === 'zh' ? 'true' : 'false');
    en.setAttribute('aria-pressed',language === 'en' ? 'true' : 'false');
    renderPeople();
    renderControls();
    selectOverlap(selected);
  }

  function selectOverlap(key) {
    selected = key;
    const definition = overlapDefs.find(item => item[0] === selected);
    root.style.setProperty('--stone',stoneByKind[definition[3]]);
    root.querySelector('#selected-anchor-port use')
      .setAttribute('href',selected === 'couples' ? '#zj-heart' : '#zj-clover');
    root.querySelectorAll('[data-overlap]').forEach(control => {
      control.setAttribute('aria-pressed',control.dataset.overlap === selected ? 'true' : 'false');
    });
    root.querySelectorAll('[data-person]').forEach(node => {
      const tags = (node.dataset.tags || '').split(/\s+/).filter(Boolean);
      const match = selected === 'couples' ? pairedPeople.has(node.dataset.person) : tags.includes(selected);
      node.classList.toggle('is-overlap',match);
      node.querySelectorAll('.guest-tag').forEach(tag => tag.classList.toggle('is-hit',tag.dataset.tag === selected));
    });
    const countText = selected === 'couples' ? `${definition[4]} ${strings[language].pairs}` : `${definition[4]} ${strings[language].people}`;
    anchorLabel.textContent = `${definition[language === 'zh' ? 1 : 2]} · ${countText}`;
    requestAnimationFrame(drawThreads);
  }

  function rectPoint(element,side='center') {
    const base = map.getBoundingClientRect();
    const rect = element.getBoundingClientRect();
    const x = {left:rect.left,right:rect.right,center:rect.left+rect.width/2}[side] ?? rect.left+rect.width/2;
    const y = {top:rect.top,bottom:rect.bottom,center:rect.top+rect.height/2}[side] ?? rect.top+rect.height/2;
    return {x:x-base.left,y:y-base.top};
  }

  function addPath(className,start,end,bend=0.5) {
    const path = document.createElementNS(SVGNS,'path');
    const midY = start.y + (end.y-start.y)*bend;
    path.setAttribute('class',className);
    path.setAttribute('d',`M ${start.x} ${start.y} C ${start.x} ${midY}, ${end.x} ${midY}, ${end.x} ${end.y}`);
    svg.appendChild(path);
    return path;
  }

  function drawIn(path,index) {
    if (reduceMotion || typeof path.getTotalLength !== 'function' || typeof path.animate !== 'function') return;
    const length = path.getTotalLength();
    if (!length) return;
    path.style.strokeDasharray = `${length}`;
    path.animate([{strokeDashoffset:length},{strokeDashoffset:0}],
      {duration:400,delay:Math.min(index,16)*55,easing:'cubic-bezier(.22,.61,.36,1)',fill:'backwards'});
  }

  function drawCoupleLink(a,b,hosts) {
    const first = root.querySelector(`[data-person="${a}"]`);
    const second = root.querySelector(`[data-person="${b}"]`);
    if (!first || !second) return;
    const firstRect = first.getBoundingClientRect();
    const secondRect = second.getBoundingClientRect();
    let start;
    let end;
    if (Math.abs((firstRect.top+firstRect.height/2)-(secondRect.top+secondRect.height/2)) < 24) {
      const leftFirst = firstRect.left < secondRect.left;
      start = rectPoint(first,leftFirst ? 'right' : 'left');
      end = rectPoint(second,leftFirst ? 'left' : 'right');
    } else {
      start = rectPoint(first.querySelector('.person-port'));
      end = rectPoint(second.querySelector('.person-port'));
    }
    const active = selected === 'couples';
    const flag = `${active ? ' is-active' : ''}${hosts ? ' is-hosts' : ''}`;
    const line = addPath(`thread-couple${flag}`,start,end,0.5);
    const middle = line.getPointAtLength(line.getTotalLength()/2);
    /* a heart carries less ink than the clover did, so nudge each size up */
    const size = hosts ? 22 : (active ? 16.5 : 13.5);
    const heart = document.createElementNS(SVGNS,'use');
    heart.setAttribute('href','#zj-heart');
    heart.setAttribute('class',`couple-heart${flag}`);
    heart.setAttribute('x',middle.x - size/2);
    heart.setAttribute('y',middle.y - size/2);
    heart.setAttribute('width',size);
    heart.setAttribute('height',size);
    svg.appendChild(heart);
  }

  function drawThreads() {
    const width = map.clientWidth;
    const height = map.clientHeight;
    if (!width || !height) return;
    svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
    while (svg.children.length > 2) svg.removeChild(svg.lastElementChild);
    couples.forEach(([a,b]) => drawCoupleLink(a,b,a === 'ziyi'));
    if (selected === 'couples') return;
    /* One chain per column gutter: every segment is vertical, so nothing ever
       crosses the guest cards and both ends of every chain sit on a lit bead. */
    const columns = new Map();
    Array.from(root.querySelectorAll('[data-person]'))
      .filter(node => (node.dataset.tags || '').split(/\s+/).includes(selected))
      .forEach(node => {
        const point = rectPoint(node.querySelector('.person-port'));
        const key = Math.round(point.x/24);
        if (!columns.has(key)) columns.set(key,[]);
        columns.get(key).push({point,absent:node.classList.contains('is-absent')});
      });
    let index = 0;
    Array.from(columns.values())
      .sort((m,n) => m[0].point.y-n[0].point.y)
      .forEach(column => {
        column.sort((m,n) => m.point.y-n.point.y);
        const x = column.reduce((sum,bead) => sum+bead.point.x,0)/column.length;
        const clasp = 8;
        let previous = {x,y:column[0].point.y-clasp};
        column.forEach(bead => {
          const path = addPath(`thread-strand${bead.absent ? ' is-absent' : ''}`,previous,{x,y:bead.point.y},0.5);
          if (!bead.absent) drawIn(path,index);
          index += 1;
          previous = {x,y:bead.point.y};
        });
        const tail = addPath('thread-strand',previous,{x,y:previous.y+clasp},0.5);
        drawIn(tail,index);
        index += 1;
      });
  }

  root.querySelector('#zj-language-cn').addEventListener('click',() => {language='zh';updateLanguage();});
  root.querySelector('#zj-language-en').addEventListener('click',() => {language='en';updateLanguage();});
  updateLanguage();
  if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(drawThreads)).observe(map);
  window.addEventListener('resize',() => requestAnimationFrame(drawThreads));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(drawThreads));
})();

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
